<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>BudBot customer widget preview</title>
    <style>
      :root{font:16px system-ui,sans-serif;color:#f4f5ff;background:#11131b}
      *{box-sizing:border-box}body{margin:0;width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;background:radial-gradient(ellipse at top right,#38205c88,transparent 50%),#11131b}
      main{width:min(720px,calc(100vw - 32px));padding:clamp(16px,4vw,28px);border:1px solid #30364b;border-radius:20px;background:#1c2030;box-shadow:0 20px 60px #080a14aa}
      h1{margin:0 0 8px;font-size:clamp(1.5rem,4vw,2rem)}p{color:#b6bfd6;line-height:1.6}budbot-widget{display:block;margin-top:22px}
      .note{padding:15px;border:1px solid #6842a5;border-radius:12px;color:#d7c7ff;background:#24193a}
      a{color:#a981ff}
    </style>
  </head>
  <body>
    <main>
      <h1>BudBot customer widget preview</h1>
      <p>This preview uses your selected business's saved branding and the normal customer session flow.</p>
      <div id="preview" class="note">Open this page from BudBot administration or Control Center to load the customer preview. No business UUID entry is needed.</div>
    </main>
    <script type="module">
      const businessId = new URLSearchParams(location.search).get("business_id");
      if (businessId) {
        const note = document.querySelector("#preview");
        note.remove();
        const script = document.createElement("script");
        script.type = "module";
        script.src = "/widget/src/embed.js?m8=branding-v1";
        script.dataset.businessId = businessId;
        document.querySelector("main").append(script);
      }
    </script>
  </body>
</html>
